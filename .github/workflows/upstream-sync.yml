name: Upstream sync

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      verify_current:
        description: Run Android checks even when the fork is already up to date
        type: boolean
        default: false
      release_merged_pr:
        description: Build and publish a previously merged upstream sync PR (optional PR number)
        type: string

permissions: {}

concurrency:
  group: upstream-sync

env:
  BASE_BRANCH: nova-style-gestures-and-layout
  SYNC_BRANCH: automation/upstream-16-dev
  STATUS_CONTEXT: Upstream sync / Android build and smoke test

jobs:
  sync:
    if: github.repository == 'andrewginns/lawnchair' && github.ref == 'refs/heads/16-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
      pull_request: ${{ steps.prepare.outputs.pull_request }}
      base_commit: ${{ steps.prepare.outputs.base_commit }}
      release_pr: ${{ steps.prepare.outputs.release_pr }}
    steps:
      - name: Check the fortnightly schedule
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A weekly cron with an epoch-based parity check keeps 14-day intervals across New Year.
          monday=$(date -u -d '2026-11-16' +%s)
          week=$(( ($(date -u +%s) - monday) / 604800 ))
          if [[ "$EVENT" != schedule ]] || (( week % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.due.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Prepare and open the sync PR
        if: steps.due.outputs.run == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_CURRENT: ${{ inputs.verify_current }}
          RELEASE_PR: ${{ inputs.release_merged_pr }}
        run: |
          git fetch origin "refs/heads/$BASE_BRANCH"
          base=$(git rev-parse FETCH_HEAD)

          if [[ -n "$RELEASE_PR" ]]; then
            [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]]
            candidate=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" | jq -er \
              --arg repo "$GITHUB_REPOSITORY" --arg branch "$BASE_BRANCH" --arg head "$SYNC_BRANCH" --arg tip "$base" \
              'select(.merged and .merged_by.login == "github-actions[bot]" and .base.ref == $branch and .head.ref == $head and .head.repo.full_name == $repo and .merge_commit_sha == $tip) | .head.sha')
            echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
            echo "release_pr=$RELEASE_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch https://github.com/LawnchairLauncher/lawnchair.git refs/heads/16-dev
          upstream=$(git rev-parse FETCH_HEAD)

          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "The target branch already includes upstream $upstream."
            if [[ "$VERIFY_CURRENT" == true ]]; then
              echo "candidate=$base" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open \
            -f base="$BASE_BRANCH" -f head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH" \
            --jq '.[0].number // empty')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sync_ref=$(git ls-remote origin "refs/heads/$SYNC_BRANCH")
          if [[ -n "$sync_ref" ]]; then
            git fetch origin "refs/heads/$SYNC_BRANCH"
            git switch --detach FETCH_HEAD
            git merge --no-edit "$base"
          else
            git switch --detach "$base"
          fi
          if ! git merge --no-edit "$upstream"; then
            echo "::error::Resolve the upstream 16-dev merge conflicts before syncing."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          candidate=$(git rev-parse HEAD)

          if ! git push origin "HEAD:refs/heads/$SYNC_BRANCH"; then
            if ! git diff --quiet "$base" "$candidate" -- .github/workflows/; then
              echo "::error::Upstream changes workflow files. If GitHub rejected the bot's token, push the merge with a maintainer's workflow permission."
            fi
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$candidate" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

          if [[ -z "$pr" ]]; then
            printf '%s\n\n%s\n' \
              'Merges LawnchairLauncher/lawnchair 16-dev into the Nova-style branch.' \
              'The sync workflow merges this PR after the style, Android build, and emulator checks pass.' \
              > "$RUNNER_TEMP/upstream-sync-pr.md"
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
              --title 'Sync Lawnchair upstream 16-dev' --body-file "$RUNNER_TEMP/upstream-sync-pr.md")
            echo "$pr_url"
            pr=${pr_url##*/}
          fi

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "pull_request=$pr" >> "$GITHUB_OUTPUT"
          echo "base_commit=$base" >> "$GITHUB_OUTPUT"

  verify:
    needs: sync
    if: needs.sync.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      apk_artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.candidate }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check formatting and build debug APK
        run: ./gradlew spotlessCheck assembleLawnWithQuickstepNightlyDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the launcher smoke test
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/lawnWithQuickstepNightly/debug/*.apk)
          [[ ${#apks[@]} == 1 ]]
          cp "${apks[0]}" "$RUNNER_TEMP/tested.apk"
          cat > "$RUNNER_TEMP/launcher-smoke.sh" <<'BASH'
          set -euo pipefail
          package=$(python3 -c 'import json; print(json.load(open("build/outputs/apk/lawnWithQuickstepNightly/debug/output-metadata.json"))["applicationId"])')
          adb install "$RUNNER_TEMP/tested.apk"
          adb logcat -b crash -c
          launcher_component=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME -p "$package" | tail -1 | tr -d '\r')
          [[ "$launcher_component" == "$package/"* ]]
          adb shell cmd package set-home-activity "$launcher_component"

          wait_resumed() {
            local expected=$1 activity
            for attempt in {1..12}; do
              activity=$(adb shell dumpsys activity activities | grep 'topResumedActivity') || true
              if [[ "$activity" == *"$expected"* ]]; then
                echo "$activity"
                return 0
              fi
              sleep 2
            done
            echo "Expected resumed activity $expected, got: $activity"
            return 1
          }

          adb shell input keyevent KEYCODE_HOME
          wait_resumed "$launcher_component"

          adb shell am start -a android.intent.action.ALL_APPS -n "$launcher_component"
          drawer=false
          for attempt in {1..6}; do
            if adb shell uiautomator dump /sdcard/launcher-smoke.xml >/dev/null &&
               adb exec-out cat /sdcard/launcher-smoke.xml > "$RUNNER_TEMP/launcher-smoke.xml" &&
               grep -Fq "resource-id=\"$package:id/apps_list_view\"" "$RUNNER_TEMP/launcher-smoke.xml"; then
              drawer=true
              break
            fi
            sleep 2
          done
          [[ "$drawer" == true ]] || { echo 'App drawer did not open'; exit 1; }

          settings_component="$package/app.lawnchair.ui.preferences.PreferenceActivity"
          adb shell am start -a android.intent.action.VIEW -d lawnchair://settings/home-screen -n "$settings_component"
          wait_resumed "$settings_component"
          adb shell input keyevent KEYCODE_HOME
          wait_resumed "$launcher_component"
          crashes=$(adb logcat -b crash -d)
          if grep -Fq "Process: $package," <<< "$crashes"; then
            echo "$crashes"
            exit 1
          fi
          BASH
      - name: Run Android 16 launcher smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: bash "$RUNNER_TEMP/launcher-smoke.sh"
      - name: Upload the tested APK
        if: needs.sync.outputs.pull_request != '' || needs.sync.outputs.release_pr != ''
        id: artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tested-nova-apk-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested.apk
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [sync, verify]
    if: always() && needs.sync.outputs.pull_request != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.sync.outputs.candidate }}
          RESULT: ${{ needs.verify.result }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

  merge:
    needs: [sync, verify, report]
    if: needs.sync.outputs.pull_request != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.sync.outputs.pull_request }}
          CANDIDATE: ${{ needs.sync.outputs.candidate }}
          BASE_COMMIT: ${{ needs.sync.outputs.base_commit }}
        run: |
          current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" --jq '.object.sha')
          if [[ "$current_base" != "$BASE_COMMIT" ]]; then
            echo "::error::The target branch changed during testing. Rerun the sync to test the new merge."
            exit 1
          fi
          pr_refs=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefName,state --jq '[.baseRefName,.headRefName,.state]|join(":")')
          [[ "$pr_refs" == "$BASE_BRANCH:$SYNC_BRANCH:OPEN" ]]
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$CANDIDATE"

  publish:
    needs: [sync, verify, merge]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.merge.result == 'success' || needs.sync.outputs.release_pr != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nova-apk-publishing
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Confirm the merged commit matches the tested source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.sync.outputs.pull_request || needs.sync.outputs.release_pr }}
          CANDIDATE: ${{ needs.sync.outputs.candidate }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          merge_sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg base "$BASE_BRANCH" --arg head "$SYNC_BRANCH" --arg sha "$CANDIDATE" \
            'select(.merged and .merged_by.login == "github-actions[bot]" and .base.ref == $base and .head.ref == $head and .head.repo.full_name == $repo and .head.sha == $sha) | .merge_commit_sha' <<< "$pr")
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          tested_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE" --jq '.tree.sha')
          merged_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq '.tree.sha')
          [[ "$tested_tree" == "$merged_tree" ]] || { echo 'The merge has a different source tree from the tested APK'; exit 1; }
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Download the tested APK
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.verify.outputs.apk_artifact }}
          path: ${{ runner.temp }}/tested-apk
      - name: Sign for updates to existing installs
        env:
          NOVA_APK_KEYSTORE: ${{ secrets.NOVA_APK_KEYSTORE }}
        run: |
          [[ -n "$NOVA_APK_KEYSTORE" ]] || { echo 'The release environment is missing NOVA_APK_KEYSTORE'; exit 1; }
          build_tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$NOVA_APK_KEYSTORE" | base64 --decode > "$keystore"
          unset NOVA_APK_KEYSTORE
          apk="$RUNNER_TEMP/Lawnchair-16-Nova-style.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --v4-signing-enabled false \
            --out "$apk" "$RUNNER_TEMP/tested-apk/tested.apk"
          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          grep -Fiq 'certificate SHA-256 digest: 7f2e5128eb089159536803992e381aa830d0e7a2d9601fac0048e3821ea02746' <<< "$certs"
          code=$("$build_tools/aapt" dump badging "$apk" | sed -nE "s/^package: name='app\.lawnchair\.nightly\.debug' versionCode='([0-9]+)'.*/\1/p")
          [[ "$code" =~ ^[0-9]+$ ]] && (( code >= 1600020100 ))
      - name: Publish the full GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ needs.sync.outputs.pull_request || needs.sync.outputs.release_pr }}
        run: |
          tag="nova-sync-$MERGE_SHA"
          apk="$RUNNER_TEMP/Lawnchair-16-Nova-style.apk"
          digest="sha256:$(sha256sum "$apk" | cut -d ' ' -f1)"
          notes="$RUNNER_TEMP/nova-release.md"
          printf 'Signed APK from upstream sync #%s.\n\nSource: %s\n\nBuild and Android 16 smoke tests: %s/%s/actions/runs/%s\n' \
            "$PR_NUMBER" "$MERGE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$notes"

          tag_refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
          target=$(jq -r --arg tag "refs/tags/$tag" '.[] | select(.ref == $tag) | .object.sha' <<< "$tag_refs")
          if [[ -z "$target" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$MERGE_SHA" >/dev/null
          else
            [[ "$target" == "$MERGE_SHA" ]] || { echo 'The release tag points to a different commit'; exit 1; }
          fi

          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -sc --arg tag "$tag" 'flatten | map(select(.tag_name == $tag)) | first // empty')
          if [[ -z "$release" ]]; then
            release=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -F draft=true -F prerelease=false \
              -f name="Lawnchair 16 Nova-style — upstream sync #$PR_NUMBER" -f "body=$(cat "$notes")")
          fi
          asset_digest=$(jq -r --arg name "${apk##*/}" '.assets[] | select(.name == $name) | .digest // ""' <<< "$release")
          if [[ $(jq -r '.draft' <<< "$release") == false ]]; then
            [[ $(jq -r '.prerelease' <<< "$release") == false && "$asset_digest" == "$digest" ]]
            exit 0
          fi
          if [[ "$asset_digest" != "$digest" ]]; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            id=$(jq -r '.id' <<< "$release")
            asset_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" | jq -r --arg name "${apk##*/}" '.[] | select(.name == $name) | .digest')
          fi
          [[ "$asset_digest" == "$digest" ]] || { echo 'The draft APK digest does not match the signed build'; exit 1; }
          latest=false
          current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" --jq '.object.sha')
          [[ "$current_base" != "$MERGE_SHA" ]] || latest=true
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest="$latest"
